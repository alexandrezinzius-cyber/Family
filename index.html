<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0eeea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family">
<title>Family — Emilie, Alexandre, Hugo &amp; Gaspard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=33">
<script src="compat.js?v=33"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if (!window.supabase) window.supabase = window.__miniSupabase;</script>
<script src="config.js"></script>
<script>
window.addEventListener('error', function (e) { var m = document.getElementById('loginMessage'); if (m) m.textContent = 'Erreur de chargement : ' + (e.message || (e.target && e.target.src) || 'fichier introuvable'); }, true);
</script>
<script src="seed-data.js?v=33"></script>
<script defer src="app.js?v=33"></script>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<section id="loginScreen" class="login">
  <div class="loginbox glass">
    <p class="script big">Family</p>
    <p class="names">Emilie · Alexandre · Hugo · Gaspard</p>
    <form id="loginForm">
      <label class="field"><span>Adresse e-mail</span><input id="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Mot de passe</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary wide">Entrer</button>
    </form>
    <p id="loginMessage" class="muted">Chargement…</p>
  </div>
</section>

<div id="appShell" class="hidden">
  <header class="topbar">
    <button class="pill round" id="homeBtn" aria-label="Accueil"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg></button>
    <button class="pill family" id="familyPill"><span class="avatar">F</span><span>Chez nous</span></button>
    <span class="grow"></span>
    <span id="syncBadge" class="sync"></span><span id="signedInAs" class="hidden"></span>
    <button class="pill bare" id="userBtn" aria-label="Compte"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.6-4.2 3.8-6.5 7.5-6.5s6.9 2.3 7.5 6.5"/></svg></button>
  </header>
  <div class="pagehead"><h1 id="heading"></h1><p id="subheading"></p></div>
  <main class="sheet">
    <div class="floatnav" id="floatnav"><button id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg></button><button id="homeBtn2" aria-label="Accueil"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg></button><span id="syncBadge2" class="sync"></span></div>
    <nav id="nav" class="menupop hidden"></nav>
    <div id="banner"></div>
    <section id="content"></section>
  </main>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>
</body>
</html>
