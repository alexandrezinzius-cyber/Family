<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8f2ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family">
<title>Family — Emilie, Alexandre, Hugo &amp; Gaspard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<section id="loginScreen" class="login hidden">
  <div class="loginbox glass">
    <p class="script big">Family</p>
    <p class="names">Emilie · Alexandre · Hugo · Gaspard</p>
    <form id="loginForm">
      <label class="field"><span>Adresse e-mail</span><input id="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Mot de passe</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary wide">Entrer</button>
    </form>
    <p id="loginMessage" class="muted"></p>
  </div>
</section>

<div id="appShell" class="hidden">
  <aside class="sidebar glass">
    <div class="logo"><span class="script">Family</span><small>Emilie · Alexandre · Hugo · Gaspard</small></div>
    <nav id="nav"></nav>
    <div class="sidefoot"><span id="syncBadge" class="sync">● Hors ligne</span><small id="signedInAs"></small><button id="logoutBtn" class="btn ghost small">Se déconnecter</button></div>
  </aside>
  <main>
    <header><h1 id="heading" class="script"></h1><span id="syncBadge2" class="sync"></span></header>
    <div id="banner"></div>
    <section id="content"></section>
  </main>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>
</body>
</html>
